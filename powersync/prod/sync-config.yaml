config:
  edition: 3

streams:
  organization_inventory:
    auto_subscribe: true
    queries:
      - |
        SELECT id, name,
          tracks_packs AS "tracksPacks",
          organization_id AS "organizationId",
          created_by_user_id AS "createdByUserId",
          updated_by_user_id AS "updatedByUserId",
          device_id AS "deviceId",
          operation_id AS "operationId",
          row_version AS "rowVersion",
          created_at AS "createdAt",
          updated_at AS "updatedAt",
          deleted_at AS "deletedAt"
        FROM categories
        WHERE organization_id = auth.parameter('org')
      - |
        SELECT id, name,
          category_id AS "categoryId",
          aisle, composition, strength,
          units_per_pack AS "unitsPerPack",
          purchase_price AS "purchasePrice",
          retail_price AS "retailPrice",
          unit_price AS "unitPrice",
          visible,
          organization_id AS "organizationId",
          created_by_user_id AS "createdByUserId",
          updated_by_user_id AS "updatedByUserId",
          device_id AS "deviceId",
          operation_id AS "operationId",
          row_version AS "rowVersion",
          created_at AS "createdAt",
          updated_at AS "updatedAt",
          deleted_at AS "deletedAt"
        FROM products
        WHERE organization_id = auth.parameter('org')
      - |
        SELECT id,
          product_id AS "productId",
          batch_number AS "batchNumber",
          expires_at AS "expiresAt",
          pack_quantity AS "packQuantity",
          unit_quantity AS "unitQuantity",
          organization_id AS "organizationId",
          created_by_user_id AS "createdByUserId",
          updated_by_user_id AS "updatedByUserId",
          device_id AS "deviceId",
          operation_id AS "operationId",
          row_version AS "rowVersion",
          created_at AS "createdAt",
          updated_at AS "updatedAt",
          deleted_at AS "deletedAt"
        FROM batches
        WHERE organization_id = auth.parameter('org')
      - |
        SELECT id,
          invoice_number AS "invoiceNumber",
          customer_name AS "customerName",
          total,
          organization_id AS "organizationId",
          created_by_user_id AS "createdByUserId",
          updated_by_user_id AS "updatedByUserId",
          device_id AS "deviceId",
          operation_id AS "operationId",
          row_version AS "rowVersion",
          created_at AS "createdAt",
          updated_at AS "updatedAt",
          deleted_at AS "deletedAt"
        FROM invoices
        WHERE organization_id = auth.parameter('org')
      - |
        SELECT id,
          invoice_id AS "invoiceId",
          product_id AS "productId",
          batch_id AS "batchId",
          product_name AS "productName",
          batch_number AS "batchNumber",
          quantity,
          quantity_type AS "quantityType",
          base_unit_quantity AS "baseUnitQuantity",
          sale_price AS "salePrice",
          organization_id AS "organizationId",
          created_by_user_id AS "createdByUserId",
          updated_by_user_id AS "updatedByUserId",
          device_id AS "deviceId",
          operation_id AS "operationId",
          row_version AS "rowVersion",
          created_at AS "createdAt",
          updated_at AS "updatedAt",
          deleted_at AS "deletedAt"
        FROM invoice_items
        WHERE organization_id = auth.parameter('org')
      - |
        SELECT id,
          product_id AS "productId",
          batch_id AS "batchId",
          invoice_id AS "invoiceId",
          type,
          pack_delta AS "packDelta",
          unit_delta AS "unitDelta",
          note,
          organization_id AS "organizationId",
          actor_user_id AS "actorUserId",
          device_id AS "deviceId",
          operation_id AS "operationId",
          created_at AS "createdAt"
        FROM stock_movements
        WHERE organization_id = auth.parameter('org')
