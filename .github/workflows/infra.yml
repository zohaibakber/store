name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to target
        required: true
        type: choice
        options: [dev, prod]
      action:
        description: Preview the plan, or apply it
        required: true
        default: plan
        type: choice
        options: [plan, deploy]

concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # See ci.yml. Skip Vite+ git hook install during `vp install`.
  VITE_GIT_HOOKS: "0"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.stage == 'prod' && 'Production' || 'Development' }}
    env:
      CI: "1"
      STAGE: ${{ inputs.stage }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Check stage configuration
        run: bash scripts/ci/check-stage-config.sh

      - name: Check provider credentials
        run: bun alchemy provider check-env --provider Cloudflare

      - name: ${{ inputs.action }} ${{ inputs.stage }}
        run: bun alchemy "${{ inputs.action }}" --stage "${STAGE}" --yes
