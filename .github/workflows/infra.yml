name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to target
        required: true
        type: choice
        options: [dev, prod]
      action:
        description: Preview the plan, or apply it
        required: true
        default: plan
        type: choice
        options: [plan, deploy]

concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # See ci.yml — skip Vite+ git hook install during `bun install`.
  VITE_GIT_HOOKS: "0"

jobs:
  run:
    runs-on: ubuntu-latest
    # `Production` should be a protected GitHub Environment requiring manual
    # approval. CLERK_SECRET_KEY is scoped per environment so the two stages
    # can never share a signing key.
    environment: ${{ inputs.stage == 'prod' && 'Production' || 'Development' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check required configuration
        run: |
          if [ -z "${CLERK_SECRET_KEY}" ]; then
            echo "::error::CLERK_SECRET_KEY is empty for stage '${{ inputs.stage }}'." \
                 "Set it on the GitHub Environment before deploying."
            exit 1
          fi
          echo "AUTH_TRUSTED_ORIGINS=${AUTH_TRUSTED_ORIGINS:-<unset>}"
          echo "ELECTRON_PROTOCOL=${ELECTRON_PROTOCOL:-<unset, default com.tabaaq.desktop>}"
          echo "MOBILE_PROTOCOL=${MOBILE_PROTOCOL:-<unset, default com.tabaaq.mobile>}"
          echo "CLERK_JWT_AUDIENCE=${CLERK_JWT_AUDIENCE:-<unset>}"
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}
          CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
          AUTH_TRUSTED_ORIGINS: ${{ vars.AUTH_TRUSTED_ORIGINS }}
          ELECTRON_PROTOCOL: ${{ vars.ELECTRON_PROTOCOL }}
          MOBILE_PROTOCOL: ${{ vars.MOBILE_PROTOCOL }}

      - name: ${{ inputs.action }} ${{ inputs.stage }}
        run: bun alchemy "${{ inputs.action }}" --stage "${{ inputs.stage }}" --yes
        env:
          CI: "1"
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}
          CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_TRUSTED_ORIGINS: ${{ vars.AUTH_TRUSTED_ORIGINS }}
          ELECTRON_PROTOCOL: ${{ vars.ELECTRON_PROTOCOL }}
          MOBILE_PROTOCOL: ${{ vars.MOBILE_PROTOCOL }}

      - name: Attach production website domain
        if: inputs.stage == 'prod' && inputs.action == 'deploy'
        run: bun alchemy deploy --stage prod --yes
        env:
          CI: "1"
          CLAIM_PRODUCTION_DOMAIN: "1"
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}
          CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_TRUSTED_ORIGINS: ${{ vars.AUTH_TRUSTED_ORIGINS }}
          ELECTRON_PROTOCOL: ${{ vars.ELECTRON_PROTOCOL }}
          MOBILE_PROTOCOL: ${{ vars.MOBILE_PROTOCOL }}
