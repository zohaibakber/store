name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to target
        required: true
        type: choice
        options: [dev, prod]
      action:
        description: Preview the plan, or apply it
        required: true
        default: plan
        type: choice
        options: [plan, deploy]

concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # `Production` should be a protected GitHub Environment requiring manual
    # approval. BETTER_AUTH_SECRET is scoped per environment so the two stages
    # can never share a signing key.
    environment: ${{ inputs.stage == 'prod' && 'Production' || 'Development' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check required configuration
        run: |
          if [ -z "${BETTER_AUTH_SECRET}" ]; then
            echo "::error::BETTER_AUTH_SECRET is empty for stage '${{ inputs.stage }}'." \
                 "Set it on the GitHub Environment before deploying."
            exit 1
          fi
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      - name: ${{ inputs.action }} ${{ inputs.stage }}
        run: bun alchemy "${{ inputs.action }}" --stage "${{ inputs.stage }}" --yes
        env:
          CI: "1"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_TRUSTED_ORIGINS: ${{ vars.AUTH_TRUSTED_ORIGINS }}
          ELECTRON_PROTOCOL: ${{ vars.ELECTRON_PROTOCOL }}
