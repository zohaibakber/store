name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to target
        required: true
        type: choice
        options: [dev, prod]
      action:
        description: Preview the plan, or apply it
        required: true
        default: plan
        type: choice
        options: [plan, deploy]

concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # See ci.yml. Skip Vite+ git hook install during `pnpm install`.
  VITE_GIT_HOOKS: "0"
  STAGE: ${{ inputs.stage }}

jobs:
  run:
    runs-on: ubuntu-latest
    # `Production` should be a protected GitHub Environment requiring manual
    # approval. Auth signing keys and peppers are scoped per environment.
    environment: ${{ inputs.stage == 'prod' && 'Production' || 'Development' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check required configuration
        run: |
          for name in AUTH_JWT_PRIVATE_JWK AUTH_JWT_PUBLIC_JWK AUTH_REFRESH_TOKEN_PEPPER \
            AUTH_EPHEMERAL_PEPPER GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET POWERSYNC_URL; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::$name is empty for stage '${{ inputs.stage }}'."
              exit 1
            fi
          done
          if [ "${{ inputs.stage }}" = "dev" ] && [ -z "${AUTH_BASE_URL}" ]; then
            echo "::error::AUTH_BASE_URL is empty for the deployed Development auth Worker."
            exit 1
          fi
          echo "AUTH_TRUSTED_ORIGINS=${AUTH_TRUSTED_ORIGINS:-<unset>}"
          echo "ELECTRON_PROTOCOL=${ELECTRON_PROTOCOL:-<unset, default com.tabaaq.desktop>}"
          echo "MOBILE_PROTOCOL=${MOBILE_PROTOCOL:-<unset, default com.tabaaq.mobile>}"
          echo "PRODUCTION_DOMAIN=${PRODUCTION_DOMAIN:-<unset>}"
          echo "VITE_API_URL=${VITE_API_URL:-<unset>}"
          echo "VITE_AUTH_URL=${VITE_AUTH_URL:-<unset>}"
          if [ "${{ inputs.stage }}" = "prod" ] && [ -z "${PRODUCTION_DOMAIN}" ]; then
            echo "::error::PRODUCTION_DOMAIN is empty." \
                 "Set PRODUCTION_DOMAIN (hostname only) on the Production GitHub Environment."
            exit 1
          fi
        env:
          AUTH_JWT_PRIVATE_JWK: ${{ secrets.AUTH_JWT_PRIVATE_JWK }}
          AUTH_JWT_PUBLIC_JWK: ${{ vars.AUTH_JWT_PUBLIC_JWK }}
          AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL }}
          AUTH_REFRESH_TOKEN_PEPPER: ${{ secrets.AUTH_REFRESH_TOKEN_PEPPER }}
          AUTH_EPHEMERAL_PEPPER: ${{ secrets.AUTH_EPHEMERAL_PEPPER }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          AUTH_TRUSTED_ORIGINS: ${{ vars.AUTH_TRUSTED_ORIGINS }}
          ELECTRON_PROTOCOL: ${{ vars.ELECTRON_PROTOCOL }}
          MOBILE_PROTOCOL: ${{ vars.MOBILE_PROTOCOL }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          PRODUCTION_API_DOMAIN: ${{ vars.PRODUCTION_API_DOMAIN }}
          PRODUCTION_AUTH_DOMAIN: ${{ vars.PRODUCTION_AUTH_DOMAIN }}
          VITE_API_URL: ${{ inputs.stage == 'prod' && vars.VITE_API_URL || '' }}
          VITE_AUTH_URL: ${{ inputs.stage == 'prod' && vars.VITE_AUTH_URL || '' }}
          POWERSYNC_URL: ${{ vars.POWERSYNC_URL }}

      - name: ${{ inputs.action }} ${{ inputs.stage }}
        run: bun alchemy "${{ inputs.action }}" --stage "${{ inputs.stage }}" --yes
        env:
          CI: "1"
          AUTH_JWT_PRIVATE_JWK: ${{ secrets.AUTH_JWT_PRIVATE_JWK }}
          AUTH_JWT_PUBLIC_JWK: ${{ vars.AUTH_JWT_PUBLIC_JWK }}
          AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL }}
          AUTH_REFRESH_TOKEN_PEPPER: ${{ secrets.AUTH_REFRESH_TOKEN_PEPPER }}
          AUTH_EPHEMERAL_PEPPER: ${{ secrets.AUTH_EPHEMERAL_PEPPER }}
          AUTH_DEV_OTP: ${{ vars.AUTH_DEV_OTP }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          AUTH_TRUSTED_ORIGINS: ${{ vars.AUTH_TRUSTED_ORIGINS }}
          ELECTRON_PROTOCOL: ${{ vars.ELECTRON_PROTOCOL }}
          MOBILE_PROTOCOL: ${{ vars.MOBILE_PROTOCOL }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          PRODUCTION_API_DOMAIN: ${{ vars.PRODUCTION_API_DOMAIN }}
          PRODUCTION_AUTH_DOMAIN: ${{ vars.PRODUCTION_AUTH_DOMAIN }}
          VITE_API_URL: ${{ inputs.stage == 'prod' && vars.VITE_API_URL || '' }}
          VITE_AUTH_URL: ${{ inputs.stage == 'prod' && vars.VITE_AUTH_URL || '' }}
          POWERSYNC_URL: ${{ vars.POWERSYNC_URL }}
