name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to target
        required: true
        type: choice
        options: [dev, prod]
      action:
        description: Preview the plan, or apply it
        required: true
        default: plan
        type: choice
        options: [plan, deploy]

concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # See ci.yml. Skip Vite+ git hook install during `vp install`.
  VITE_GIT_HOOKS: "0"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.stage == 'prod' && 'Production' || 'Development' }}
    env:
      CI: "1"
      STAGE: ${{ inputs.stage }}
      AUTH_JWT_PRIVATE_JWK: ${{ secrets.AUTH_JWT_PRIVATE_JWK }}
      AUTH_JWT_PUBLIC_JWK: ${{ vars.AUTH_JWT_PUBLIC_JWK }}
      AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL }}
      AUTH_REFRESH_TOKEN_PEPPER: ${{ secrets.AUTH_REFRESH_TOKEN_PEPPER }}
      AUTH_EPHEMERAL_PEPPER: ${{ secrets.AUTH_EPHEMERAL_PEPPER }}
      AUTH_DEV_OTP: ${{ vars.AUTH_DEV_OTP }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
      PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
      PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
      NEON_API_KEY: ${{ inputs.stage == 'dev' && secrets.NEON_API_KEY || '' }}
      AUTH_TRUSTED_ORIGINS: ${{ vars.AUTH_TRUSTED_ORIGINS }}
      ELECTRON_PROTOCOL: ${{ vars.ELECTRON_PROTOCOL }}
      MOBILE_PROTOCOL: ${{ vars.MOBILE_PROTOCOL }}
      PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
      PRODUCTION_API_DOMAIN: ${{ vars.PRODUCTION_API_DOMAIN }}
      PRODUCTION_AUTH_DOMAIN: ${{ vars.PRODUCTION_AUTH_DOMAIN }}
      VITE_API_URL: ${{ inputs.stage != 'dev' && vars.VITE_API_URL || '' }}
      VITE_AUTH_URL: ${{ inputs.stage != 'dev' && vars.VITE_AUTH_URL || '' }}
      VITE_SENTRY_DSN: ${{ inputs.stage != 'dev' && vars.VITE_SENTRY_DSN || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Check stage configuration
        run: bash scripts/ci/check-stage-config.sh

      - name: Check provider credentials
        run: bun alchemy provider check-env --provider Cloudflare --provider "${{ inputs.stage == 'dev' && 'Neon' || 'Planetscale' }}"

      - name: ${{ inputs.action }} ${{ inputs.stage }}
        run: bun alchemy "${{ inputs.action }}" --stage "${STAGE}" --yes
