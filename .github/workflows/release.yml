name: Release

on:
  workflow_call:
    outputs:
      version:
        description: Desktop version published by this run
        value: ${{ jobs.version.outputs.version }}
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  VITE_GIT_HOOKS: "0"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Next desktop version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            version="$(node -p "require('./apps/desktop/package.json').version")"
          fi
          while gh release view "v${version}" >/dev/null 2>&1; do
            IFS=. read -r major minor patch <<< "$version"
            version="${major}.${minor}.$((patch + 1))"
          done
          echo "Releasing desktop ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # Windows packaging is paused until its CI runtime is worth restoring.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Same GitHub Environment as the Worker deploy, so desktop builds read the
    # public API URL and protocol that deployment trusts.
    environment: Production
    env:
      # Environment variables, not secrets: an API hostname and a URL scheme
      # are not confidential, and keeping them visible means a build that
      # points somewhere unexpected is obvious in the logs rather than
      # masked as ***.
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      ELECTRON_PROTOCOL: ${{ vars.ELECTRON_PROTOCOL }}
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - name: Check required configuration
        run: |
          if [ -z "${VITE_API_URL}" ]; then
            echo "::error::VITE_API_URL is empty." \
                 "Set it on the Production GitHub Environment" \
                 "or the packaged desktop app will talk to localhost."
            exit 1
          fi
          if [ -z "${VITE_AUTH_URL}" ]; then
            echo "::error::VITE_AUTH_URL is empty." \
                 "Set it on the Production GitHub Environment or packaged sign-in cannot reach auth."
            exit 1
          fi
          echo "VITE_API_URL=${VITE_API_URL}"
          echo "VITE_AUTH_URL=${VITE_AUTH_URL}"
          echo "VITE_SENTRY_DSN=${VITE_SENTRY_DSN:+set}"
          echo "ELECTRON_PROTOCOL=${ELECTRON_PROTOCOL:-<unset, default com.tabaaq.desktop>}"

      - name: Set desktop app version
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "apps/desktop/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          ' "${{ needs.version.outputs.version }}"

      - name: Build and publish
        working-directory: apps/desktop
        run: vp run release
        env:
          # Publishes to this repo directly now that it's public; the default
          # GITHUB_TOKEN has contents:write (see workflow permissions above).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish complete release
        run: |
          gh release edit "v${{ needs.version.outputs.version }}" \
            --draft=false \
            --prerelease=false \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
