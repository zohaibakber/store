name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # Windows packaging is paused until its CI runtime is worth restoring.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Same GitHub Environment as the production Worker deploy, so desktop
    # builds read the same public API URL and protocol the Worker trusts.
    environment: Production
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check required configuration
        run: |
          if [ -z "${VITE_API_URL}" ]; then
            echo "::error::VITE_API_URL is empty." \
                 "Set it on the Production GitHub Environment to https://tabaaq.zohaibakber.com" \
                 "or the packaged desktop app will talk to localhost."
            exit 1
          fi
          if [ -z "${VITE_CLERK_PUBLISHABLE_KEY}" ]; then
            echo "::error::VITE_CLERK_PUBLISHABLE_KEY is empty." \
                 "Set it on the Production GitHub Environment or packaged sign-in cannot load Clerk."
            exit 1
          fi
          echo "VITE_API_URL=${VITE_API_URL}"
          echo "ELECTRON_PROTOCOL=${ELECTRON_PROTOCOL:-<unset, default com.tabaaq.desktop>}"
          echo "VITE_CLERK_JWT_TEMPLATE=${VITE_CLERK_JWT_TEMPLATE:-<unset>}"
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          ELECTRON_PROTOCOL: ${{ vars.ELECTRON_PROTOCOL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_JWT_TEMPLATE: ${{ vars.VITE_CLERK_JWT_TEMPLATE }}

      - name: Set desktop app version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("node:fs");
            const path = "apps/desktop/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          ' "$VERSION"

      - name: Build and publish
        working-directory: apps/desktop
        run: bun run release
        env:
          # Publishes to this repo directly now that it's public; the default
          # GITHUB_TOKEN has contents:write (see workflow permissions above).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Environment variables, not secrets: an API hostname and a URL scheme
          # are not confidential, and keeping them visible means a build that
          # points somewhere unexpected is obvious in the logs rather than
          # masked as ***.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          ELECTRON_PROTOCOL: ${{ vars.ELECTRON_PROTOCOL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_JWT_TEMPLATE: ${{ vars.VITE_CLERK_JWT_TEMPLATE }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish complete release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
