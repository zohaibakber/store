name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # `vp config` (prepare) writes `core.hooksPath`. Skip that in CI so install
  # cannot race two git-config locks. Hooks are not used in Actions.
  VITE_GIT_HOOKS: "0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - name: Check (format, lint, typecheck)
        run: vp check

      - name: Schema checks
        run: vp run -r check

      - name: Tests
        run: vp test

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      CI: "1"
      STAGE: prod
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - name: Check stage configuration
        run: bash scripts/ci/check-stage-config.sh

      - name: Check provider credentials
        run: vp exec alchemy provider check-env --provider Cloudflare

      - name: Deploy prod
        run: vp exec alchemy deploy --stage "${STAGE}" --yes

  desktop:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/release.yml
    with:
      publish: false

  publish-desktop:
    needs: [deploy, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish complete release
        run: |
          gh release edit "v${{ needs.desktop.outputs.version }}" \
            --draft=false \
            --prerelease=false \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  discard-desktop:
    needs: [deploy, desktop]
    if: failure() && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete unpublished draft
        run: gh release delete "v${{ needs.desktop.outputs.version }}" --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
