name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # `vp config` (prepare) writes `core.hooksPath`. Skip that in CI so install
  # cannot race two git-config locks. Hooks are not used in Actions.
  VITE_GIT_HOOKS: "0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - name: Check (format, lint, typecheck)
        run: vp check

      - name: Design lint
        run: vp run lint:design

      - name: Schema checks
        run: vp run -r check

      - name: Tests
        run: vp test

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      CI: "1"
      STAGE: prod
      AUTH_JWT_PRIVATE_JWK: ${{ secrets.AUTH_JWT_PRIVATE_JWK }}
      AUTH_JWT_PUBLIC_JWK: ${{ vars.AUTH_JWT_PUBLIC_JWK }}
      AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL }}
      AUTH_REFRESH_TOKEN_PEPPER: ${{ secrets.AUTH_REFRESH_TOKEN_PEPPER }}
      AUTH_EPHEMERAL_PEPPER: ${{ secrets.AUTH_EPHEMERAL_PEPPER }}
      AUTH_DEV_OTP: ${{ vars.AUTH_DEV_OTP }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
      PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
      PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
      AUTH_TRUSTED_ORIGINS: ${{ vars.AUTH_TRUSTED_ORIGINS }}
      ELECTRON_PROTOCOL: ${{ vars.ELECTRON_PROTOCOL }}
      MOBILE_PROTOCOL: ${{ vars.MOBILE_PROTOCOL }}
      PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
      PRODUCTION_API_DOMAIN: ${{ vars.PRODUCTION_API_DOMAIN }}
      PRODUCTION_AUTH_DOMAIN: ${{ vars.PRODUCTION_AUTH_DOMAIN }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Check stage configuration
        run: bash scripts/ci/check-stage-config.sh

      - name: Check provider credentials
        run: bun alchemy provider check-env --provider Cloudflare --provider Planetscale

      - name: Deploy prod
        run: bun alchemy deploy --stage "${STAGE}" --yes

  desktop:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/release.yml
    with:
      publish: false

  publish-desktop:
    needs: [deploy, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish complete release
        run: |
          gh release edit "v${{ needs.desktop.outputs.version }}" \
            --draft=false \
            --prerelease=false \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  discard-desktop:
    needs: [deploy, desktop]
    if: failure() && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete unpublished draft
        run: gh release delete "v${{ needs.desktop.outputs.version }}" --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
