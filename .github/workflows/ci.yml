name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: >-
    deploy-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.number)
      || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  STAGE: >-
    ${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.number)
      || 'prod' }}
  # `vp config` (prepare) writes `core.hooksPath`. Skip that in CI so install
  # cannot race two git-config locks. Hooks are not used in Actions.
  VITE_GIT_HOOKS: "0"

jobs:
  verify:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (format, lint, typecheck)
        run: bunx vp check

      - name: Workspace checks
        run: bun run check

      - name: Tests
        run: bunx vp test

  deploy:
    needs: verify
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'Production' || 'Development' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check required configuration
        run: |
          for name in AUTH_JWT_PRIVATE_JWK AUTH_JWT_PUBLIC_JWK AUTH_REFRESH_TOKEN_PEPPER \
            AUTH_EPHEMERAL_PEPPER GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::$name is empty for ${STAGE}."
              exit 1
            fi
          done
          echo "AUTH_TRUSTED_ORIGINS=${AUTH_TRUSTED_ORIGINS:-<unset>}"
          echo "ELECTRON_PROTOCOL=${ELECTRON_PROTOCOL:-<unset, default com.tabaaq.desktop>}"
          echo "MOBILE_PROTOCOL=${MOBILE_PROTOCOL:-<unset, default com.tabaaq.mobile>}"
          echo "PRODUCTION_DOMAIN=${PRODUCTION_DOMAIN:-<unset>}"
          echo "VITE_API_URL=${VITE_API_URL:-<unset>}"
          echo "VITE_AUTH_URL=${VITE_AUTH_URL:-<unset>}"
          if [ "${STAGE}" = "prod" ] && [ -z "${PRODUCTION_DOMAIN}" ]; then
            echo "::error::PRODUCTION_DOMAIN is empty." \
                 "Set PRODUCTION_DOMAIN (hostname only) on the Production GitHub Environment."
            exit 1
          fi
        env:
          AUTH_JWT_PRIVATE_JWK: ${{ secrets.AUTH_JWT_PRIVATE_JWK }}
          AUTH_JWT_PUBLIC_JWK: ${{ vars.AUTH_JWT_PUBLIC_JWK }}
          AUTH_REFRESH_TOKEN_PEPPER: ${{ secrets.AUTH_REFRESH_TOKEN_PEPPER }}
          AUTH_EPHEMERAL_PEPPER: ${{ secrets.AUTH_EPHEMERAL_PEPPER }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          AUTH_TRUSTED_ORIGINS: ${{ vars.AUTH_TRUSTED_ORIGINS }}
          ELECTRON_PROTOCOL: ${{ vars.ELECTRON_PROTOCOL }}
          MOBILE_PROTOCOL: ${{ vars.MOBILE_PROTOCOL }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          PRODUCTION_API_DOMAIN: ${{ vars.PRODUCTION_API_DOMAIN }}
          PRODUCTION_AUTH_DOMAIN: ${{ vars.PRODUCTION_AUTH_DOMAIN }}
          VITE_API_URL: ${{ github.event_name == 'push' && vars.VITE_API_URL || '' }}
          VITE_AUTH_URL: ${{ github.event_name == 'push' && vars.VITE_AUTH_URL || '' }}

      - name: Deploy ${{ env.STAGE }}
        run: bun alchemy deploy --stage "${STAGE}" --yes
        env:
          CI: "1"
          AUTH_JWT_PRIVATE_JWK: ${{ secrets.AUTH_JWT_PRIVATE_JWK }}
          AUTH_JWT_PUBLIC_JWK: ${{ vars.AUTH_JWT_PUBLIC_JWK }}
          AUTH_REFRESH_TOKEN_PEPPER: ${{ secrets.AUTH_REFRESH_TOKEN_PEPPER }}
          AUTH_EPHEMERAL_PEPPER: ${{ secrets.AUTH_EPHEMERAL_PEPPER }}
          AUTH_DEV_OTP: ${{ vars.AUTH_DEV_OTP }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_TRUSTED_ORIGINS: ${{ vars.AUTH_TRUSTED_ORIGINS }}
          ELECTRON_PROTOCOL: ${{ vars.ELECTRON_PROTOCOL }}
          MOBILE_PROTOCOL: ${{ vars.MOBILE_PROTOCOL }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          PRODUCTION_API_DOMAIN: ${{ vars.PRODUCTION_API_DOMAIN }}
          PRODUCTION_AUTH_DOMAIN: ${{ vars.PRODUCTION_AUTH_DOMAIN }}
          VITE_API_URL: ${{ github.event_name == 'push' && vars.VITE_API_URL || '' }}
          VITE_AUTH_URL: ${{ github.event_name == 'push' && vars.VITE_AUTH_URL || '' }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.number || '' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Development
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refuse to destroy production
        run: |
          if [ "${STAGE}" = "prod" ]; then
            echo "::error::Refusing to destroy the production stage."
            exit 1
          fi

      - name: Destroy preview
        run: bun alchemy destroy --stage "${STAGE}" --yes
        env:
          CI: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
