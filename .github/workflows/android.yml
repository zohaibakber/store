name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VITE_GIT_HOOKS: "0"

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_AUTH_URL: ${{ vars.EXPO_PUBLIC_AUTH_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      GRADLE_OPTS: >-
        -Dorg.gradle.parallel=false
        -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Android build tools
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;27.1.12297006"

      - name: Check required configuration
        run: |
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_AUTH_URL EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::$name is empty." \
                "Set it on the Production GitHub Environment."
              exit 1
            fi
          done
          echo "EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL}"
          echo "EXPO_PUBLIC_AUTH_URL=${EXPO_PUBLIC_AUTH_URL}"
          echo "EXPO_PUBLIC_SENTRY_DSN=${EXPO_PUBLIC_SENTRY_DSN:+set}"

      - name: Build arm64 release APK
        working-directory: apps/mobile/android
        run: >-
          ./gradlew :app:assembleRelease
          --no-daemon
          --max-workers=2
          -Dorg.gradle.parallel=false
          -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK
        working-directory: apps/mobile/android
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "${apk}"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "${apk}"
          badging="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "${apk}")"
          echo "${badging}" | head -n 1
          echo "${badging}" | grep -F "name='com.tabaaq.mobile'"
          echo "${badging}" | grep -F "versionName='0."
          if echo "${badging}" | grep -q "versionName='.*-debug'"; then
            echo "::error::Release APK must not use a -debug versionName."
            exit 1
          fi
          mapfile -t native_abis < <(
            unzip -Z1 "${apk}" |
              sed -n 's#^lib/\([^/]*\)/.*#\1#p' |
              sort -u
          )
          test "${#native_abis[@]}" -eq 1
          test "${native_abis[0]}" = "arm64-v8a"
          sha256sum "${apk}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tabaaq-android-arm64-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/mobile/app.json').expo.version")"
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          asset="Tabaaq-Android-${version}.apk"
          cp "${apk}" "${asset}"
          tag="android"
          notes_file="$(mktemp)"
          {
            echo "Sideload APK for Pixel and other arm64 devices (\`com.tabaaq.mobile\`)."
            echo
            echo "Commit: ${{ github.sha }}"
            echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Desktop auto-update keeps using the latest \`v*.*.*\` release."
          } > "${notes_file}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${asset}" --clobber
            gh release edit "${tag}" \
              --title "Tabaaq Android v${version}" \
              --notes-file "${notes_file}" \
              --latest=false
          else
            gh release create "${tag}" "${asset}" \
              --title "Tabaaq Android v${version}" \
              --notes-file "${notes_file}" \
              --latest=false
          fi
