name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VITE_GIT_HOOKS: "0"

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    env:
      API_URL: ${{ vars.VITE_API_URL }}
      AUTH_URL: ${{ vars.VITE_AUTH_URL }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      GRADLE_OPTS: >-
        -Dorg.gradle.parallel=false
        -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: android-actions/setup-android@v4
        with:
          packages: tools platform-tools

      - name: Cache Android SDK packages
        uses: actions/cache@v6
        id: android-sdk
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-api37-build-tools-36.0.0

      - name: Install Android build tools
        if: steps.android-sdk.outputs.cache-hit != 'true'
        run: >-
          sdkmanager
          "platforms;android-37.0"
          "build-tools;36.0.0"

      - name: Check required configuration
        run: |
          for name in API_URL AUTH_URL GOOGLE_WEB_CLIENT_ID; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::$name is empty." \
                "Set VITE_API_URL, VITE_AUTH_URL, and GOOGLE_OAUTH_CLIENT_ID" \
                "on the Production GitHub Environment."
              exit 1
            fi
          done
          echo "API_URL=${API_URL}"
          echo "AUTH_URL=${AUTH_URL}"

      - name: Write local.properties
        working-directory: apps/android
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "API_URL=${API_URL}"
            echo "AUTH_URL=${AUTH_URL}"
            echo "GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}"
            echo "NATIVE_ORIGIN=com.tabaaq.mobile://app"
          } > local.properties

      - name: Build release APK
        working-directory: apps/android
        run: >-
          ./gradlew :app:assembleRelease
          --max-workers=2
          -Dorg.gradle.parallel=false

      - name: Verify APK
        working-directory: apps/android
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "${apk}"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "${apk}"
          badging="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "${apk}")"
          echo "${badging}" | head -n 1
          echo "${badging}" | grep -F "name='com.tabaaq.mobile'"
          echo "${badging}" | grep -F "versionName='0."
          if echo "${badging}" | grep -q "versionName='.*-debug'"; then
            echo "::error::Release APK must not use a -debug versionName."
            exit 1
          fi
          sha256sum "${apk}"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: tabaaq-android-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' apps/android/app/build.gradle.kts | head -n 1)"
          apk="apps/android/app/build/outputs/apk/release/app-release.apk"
          asset="Tabaaq-Android-${version}.apk"
          cp "${apk}" "${asset}"
          tag="android"
          notes_file="$(mktemp)"
          {
            echo "Sideload APK for Android (\`com.tabaaq.mobile\`)."
            echo
            echo "Commit: ${{ github.sha }}"
            echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Desktop auto-update keeps using the latest \`v*.*.*\` release."
          } > "${notes_file}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${asset}" --clobber
            gh release edit "${tag}" \
              --title "Tabaaq Android v${version}" \
              --notes-file "${notes_file}" \
              --latest=false
          else
            gh release create "${tag}" "${asset}" \
              --title "Tabaaq Android v${version}" \
              --notes-file "${notes_file}" \
              --latest=false
          fi
