name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VITE_GIT_HOOKS: "0"

jobs:
  eas-build-submit:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN is empty." \
                 "Create an access token at https://expo.dev/settings/access-tokens" \
                 "and set it as the repository secret EXPO_TOKEN."
            exit 1
          fi

      - name: Write Play service account key
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON is unset." \
                 "EAS Submit will use a Google Play key stored on the Expo account."
            exit 0
          fi
          printf '%s' "${GOOGLE_SERVICE_ACCOUNT_JSON}" > pc-api-key.json
          node -e '
            const fs = require("node:fs");
            const path = "eas.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.submit.production.android.serviceAccountKeyPath = "./pc-api-key.json";
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          '

      - name: Build and submit Android
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_AUTH_URL: ${{ vars.EXPO_PUBLIC_AUTH_URL }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
        run: eas build --platform android --profile production --non-interactive --auto-submit
