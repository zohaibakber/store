packages:
  - apps/*
  - packages/*

# Electron Forge walks a real node_modules tree. Isolated linking fails its
# preflight (`pnpm config get node-linker`) and packaging.
nodeLinker: hoisted

catalog:
  "@effect/sql-d1": 4.0.0-rc.111
  "@effect/sql-sqlite-do": 4.0.0-rc.111
  "@effect/vitest": 4.0.0-rc.111
  alchemy: 2.0.0-beta.74
  drizzle-kit: 1.0.0-rc.5-ab785fc
  drizzle-orm: 1.0.0-rc.5-ab785fc
  effect: 4.0.0-rc.111
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9

overrides:
  "@effect/platform-node-shared": 4.0.0-rc.111
  "@effect/sql-d1": 4.0.0-rc.111
  "@effect/sql-sqlite-do": 4.0.0-rc.111
  drizzle-orm: 1.0.0-rc.5-ab785fc
  # Forge 7.x pins @electron/rebuild@3.7, which depends on a git tarball of
  # @electron/node-gyp. pnpm 11 blockExoticSubdeps refuses that. 4.x uses
  # registry node-gyp and is the documented drop-in for Forge 7 consumers.
  "@electron/rebuild": "^4.0.4"
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.11

onlyBuiltDependencies:
  - "@sentry/cli"
  - better-sqlite3
  - electron
  - esbuild
  - sharp
  - workerd

allowBuilds:
  "@firebase/util": false
  "@journeyapps/wa-sqlite": true
  "@sentry/cli": true
  better-sqlite3: true
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: true
  protobufjs: false
  workerd: true

minimumReleaseAgeExclude:
  - "@tanstack/db@0.8.3"
  - "@tanstack/powersync-db-collection@0.1.62"
  - "@tanstack/react-db@0.3.3"
