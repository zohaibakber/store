    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser CSP is injected by the web Vite plugin. Electron omits that
         plugin and applies CSP from the main-process protocol handler instead. -->
    <title>Tabaaq</title>

      html,
      body {
        background: #fff;
      }
      html.dark,
      html.dark body {
        background: color-mix(in srgb, #0a0a0a 95%, #fff);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
