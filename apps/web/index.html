<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' https://*.clerk.accounts.dev https://clerk.tabaaq.zohaibakber.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://img.clerk.com; font-src 'self' data:; connect-src 'self' https: ws: http://localhost:*; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <title>Tabaaq</title>
    <script src="/theme-init.js"></script>
    <style>
      :root {
        --app-loading-background: #f5f5f4;
        --app-loading-foreground: #1c1917;
      }
      :root.dark {
        --app-loading-background: #0a0a0a;
        --app-loading-foreground: #fafaf9;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--app-loading-background);
        transition: opacity 0.15s ease-out;
      }
      #app-loading svg {
        width: 24px;
        height: 24px;
        color: var(--app-loading-foreground);
      }
      #app-loading.app-loading-hidden {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          --app-loading-background: #0a0a0a;
          --app-loading-foreground: #fafaf9;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-loading">
      <svg aria-label="Loading" fill="none" role="status" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9.5" opacity="0.1" stroke-width="2" />
        <circle cx="12" cy="12" r="9.5" stroke-dasharray="42 150" stroke-width="2">
          <animateTransform
            attributeName="transform"
            dur="1s"
            from="0 12 12"
            repeatCount="indefinite"
            to="360 12 12"
            type="rotate"
          />
        </circle>
      </svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
